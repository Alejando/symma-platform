openapi: 3.0.3
info:
  title: Symma API — Patients Contracts
  version: 1.1.0
  description: >
    Therapist JWT required. Patients of another therapist answer 404. The PIN is stored only as an
    HMAC-SHA256 and no response ever contains it or its hash. Statistics: see analytics.yaml.

paths:
  /patients:
    post:
      tags: [Patients]
      operationId: createPatient
      summary: Create a patient for the authenticated therapist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
    get:
      tags: [Patients]
      operationId: listPatients
      summary: List the therapist's non-archived patients (paginated)
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Search'
      responses:
        '200':
          description: One page of patients
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PatientResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /patients/{id}:
    get:
      tags: [Patients]
      operationId: getPatient
      summary: Get a patient by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      responses:
        '200':
          description: The patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    patch:
      tags: [Patients]
      operationId: updatePatient
      summary: Update a patient
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        '200':
          description: Patient updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    delete:
      tags: [Patients]
      operationId: deletePatient
      summary: Archive a patient (soft delete); their patient tokens stop working
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      responses:
        '204':
          description: Archived
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /patients/{id}/access-code:
    post:
      tags: [Patients]
      operationId: generateAccessCode
      summary: Generate a new 6-digit PIN; tokens issued for the previous PIN stop working
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      responses:
        '201':
          description: The plain PIN, shown only once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCodeResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '503':
          $ref: './common.yaml#/components/responses/ServiceUnavailable'
    delete:
      tags: [Patients]
      operationId: revokeAccessCode
      summary: Revoke the PIN; tokens issued for it stop working immediately
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /patients/{id}/access-code/status:
    get:
      tags: [Patients]
      operationId: getAccessCodeStatus
      summary: Whether the patient has an active PIN
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      responses:
        '200':
          description: PIN status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCodeStatusResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreatePatientRequest:
      type: object
      required: [firstName, lastName, email, dateOfBirth]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        dateOfBirth:
          type: string
          format: date
          description: YYYY-MM-DD
        gender:
          $ref: './common.yaml#/components/schemas/Gender'
        phoneNumber:
          type: string
        diagnosis:
          type: string
        initialParalysisDegree:
          type: integer
          minimum: 1
          maximum: 6
          description: House-Brackmann scale
        clinicalNotes:
          type: string
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string

    UpdatePatientRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        dateOfBirth:
          type: string
          format: date
        gender:
          $ref: './common.yaml#/components/schemas/Gender'
        phoneNumber:
          type: string
        status:
          $ref: './common.yaml#/components/schemas/PatientStatus'
        diagnosis:
          type: string
        initialParalysisDegree:
          type: integer
          minimum: 1
          maximum: 6
        clinicalNotes:
          type: string
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string

    PatientResponse:
      type: object
      required: [id, therapistId, firstName, lastName, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        therapistId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        gender:
          allOf:
            - $ref: './common.yaml#/components/schemas/Gender'
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        status:
          $ref: './common.yaml#/components/schemas/PatientStatus'
        diagnosis:
          type: string
          nullable: true
        initialParalysisDegree:
          type: integer
          nullable: true
          description: House-Brackmann scale 1–6
        clinicalNotes:
          type: string
          nullable: true
        emergencyContactName:
          type: string
          nullable: true
        emergencyContactPhone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccessCodeResponse:
      type: object
      required: [accessCode, patientId]
      properties:
        accessCode:
          type: string
          pattern: '^\d{6}$'
          description: Plain-text 6-digit code (shown once)
        patientId:
          type: string
          format: uuid

    AccessCodeStatusResponse:
      type: object
      required: [hasAccessCode]
      properties:
        hasAccessCode:
          type: boolean
