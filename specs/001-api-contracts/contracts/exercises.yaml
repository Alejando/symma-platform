openapi: 3.0.3
info:
  title: Symma API — Exercises Contracts
  version: 1.1.0
  description: >
    Global exercise catalog. Any therapist may read it; only role ADMIN may create, update or
    delete (403 otherwise). Exercises used by an ACTIVE routine cannot be updated or deleted (409).

paths:
  /exercises:
    get:
      tags: [Exercises]
      operationId: listExercises
      summary: List exercises (paginated, ordered by name)
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Search'
      responses:
        '200':
          description: One page of exercises
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExerciseResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
    post:
      tags: [Exercises]
      operationId: createExercise
      summary: Create an exercise (ADMIN only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExerciseRequest'
      responses:
        '201':
          description: Exercise created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          description: keyName already exists
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'

  /exercises/{id}:
    get:
      tags: [Exercises]
      operationId: getExercise
      summary: Get an exercise by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      responses:
        '200':
          description: The exercise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    patch:
      tags: [Exercises]
      operationId: updateExercise
      summary: Update an exercise (ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExerciseRequest'
      responses:
        '200':
          description: Exercise updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          description: Used by an ACTIVE routine, or keyName already exists
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'
    delete:
      tags: [Exercises]
      operationId: deleteExercise
      summary: Delete an exercise (ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          description: Used by an ACTIVE routine, or still referenced by other routines or sessions
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ExerciseDefaultConfig:
      type: object
      properties:
        threshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Success threshold (0.0–1.0)
        holdTime:
          type: integer
          minimum: 0
          description: Hold time in seconds
        restTime:
          type: integer
          minimum: 0
          description: Rest time in seconds

    CreateExerciseRequest:
      type: object
      required: [keyName, name, type, category]
      properties:
        keyName:
          type: string
          description: Unique key identifier for the exercise
        name:
          type: string
        description:
          type: string
        type:
          $ref: './common.yaml#/components/schemas/ExerciseType'
        category:
          $ref: './common.yaml#/components/schemas/ExerciseCategory'
        mobileModule:
          $ref: './common.yaml#/components/schemas/MobileModule'
        assetAnimationUrl:
          type: string
          format: uri
        assetTutorialVideoUrl:
          type: string
          format: uri
        defaultConfig:
          $ref: '#/components/schemas/ExerciseDefaultConfig'

    UpdateExerciseRequest:
      type: object
      properties:
        keyName:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          $ref: './common.yaml#/components/schemas/ExerciseType'
        category:
          $ref: './common.yaml#/components/schemas/ExerciseCategory'
        mobileModule:
          $ref: './common.yaml#/components/schemas/MobileModule'
        assetAnimationUrl:
          type: string
          format: uri
        assetTutorialVideoUrl:
          type: string
          format: uri
        defaultConfig:
          $ref: '#/components/schemas/ExerciseDefaultConfig'

    ExerciseResponse:
      type: object
      required: [id, keyName, name, type, category, createdAt]
      properties:
        id:
          type: string
          format: uuid
        keyName:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        type:
          $ref: './common.yaml#/components/schemas/ExerciseType'
        category:
          $ref: './common.yaml#/components/schemas/ExerciseCategory'
        mobileModule:
          allOf:
            - $ref: './common.yaml#/components/schemas/MobileModule'
          nullable: true
        assetAnimationUrl:
          type: string
          nullable: true
        assetTutorialVideoUrl:
          type: string
          nullable: true
        defaultConfig:
          allOf:
            - $ref: '#/components/schemas/ExerciseDefaultConfig'
          nullable: true
        createdAt:
          type: string
          format: date-time
