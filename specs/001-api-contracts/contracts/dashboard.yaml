openapi: 3.0.3
info:
  title: Symma API — Dashboard Contracts
  version: 1.1.0

paths:
  /dashboard/stats:
    get:
      tags: [Dashboard]
      operationId: getDashboardStats
      summary: Dashboard statistics for the authenticated therapist
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metrics and patients at risk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DashboardMetric:
      type: object
      required: [value, trend]
      properties:
        value:
          type: integer
          description: Current metric value
        trend:
          type: integer
          description: Percentage change (0 = no trend data available)

    AtRiskPatientResponse:
      type: object
      required: [id, name, daysInactive]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Full name (firstName + lastName)
        daysInactive:
          type: integer
          minimum: 0
          description: Number of days since last session

    DashboardStatsResponse:
      type: object
      required: [metrics, atRiskPatients]
      properties:
        metrics:
          type: object
          required: [activePatients, complianceAlerts, avgEfficacy]
          properties:
            activePatients:
              $ref: '#/components/schemas/DashboardMetric'
            complianceAlerts:
              $ref: '#/components/schemas/DashboardMetric'
            avgEfficacy:
              allOf:
                - $ref: '#/components/schemas/DashboardMetric'
              description: >
                Average session score (0–100, same scale as routine analytics) over the last 7 days
        atRiskPatients:
          type: array
          items:
            $ref: '#/components/schemas/AtRiskPatientResponse'
