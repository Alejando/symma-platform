openapi: 3.0.3
info:
  title: Symma API — Routines Contracts
  version: 1.1.0
  description: >
    Therapist JWT required; routines of another therapist's patients answer 404. A patient has at
    most one ACTIVE routine, which is the only one served to the mobile app.

paths:
  /routines:
    post:
      tags: [Routines]
      operationId: createRoutine
      summary: Create a routine; it becomes ACTIVE and the patient's previous ACTIVE routine is archived
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoutineRequest'
      responses:
        '201':
          description: Routine created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          description: An exercise does not exist
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'
    get:
      tags: [Routines]
      operationId: listRoutines
      summary: List the therapist's routines (paginated)
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of routines
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RoutineResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /routines/{id}:
    get:
      tags: [Routines]
      operationId: getRoutine
      summary: Get a routine (items with exercises, patient, sessionsCount)
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      responses:
        '200':
          description: The routine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    put:
      tags: [Routines]
      operationId: updateRoutine
      summary: Update a routine (items are fully replaced when given)
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoutineRequest'
      responses:
        '200':
          description: Routine updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          description: Items cannot change once the routine has sessions; clone it instead
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'
    delete:
      tags: [Routines]
      operationId: deleteRoutine
      summary: Delete a routine, or archive it when it has sessions
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      responses:
        '204':
          description: Deleted or archived
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /routines/{id}/clone:
    post:
      tags: [Routines]
      operationId: cloneRoutine
      summary: Clone a routine as DRAFT; the original and what the patient receives are unchanged
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      responses:
        '201':
          description: The DRAFT copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /routines/{id}/activate:
    post:
      tags: [Routines]
      operationId: activateRoutine
      summary: Make the routine ACTIVE and archive the patient's other ACTIVE routine, in one transaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      responses:
        '200':
          description: The activated routine (unchanged if it was already ACTIVE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          description: Concurrent activation for the same patient
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'

  /patients/{id}/routines:
    get:
      tags: [Routines]
      operationId: listPatientRoutines
      summary: List every routine of a patient, newest first
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Id'
      responses:
        '200':
          description: Routines of the patient
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoutineResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RoutineItemRequest:
      type: object
      required: [exerciseId, sets, repsPerSet, targetHoldSeconds]
      properties:
        exerciseId:
          type: string
          format: uuid
        sets:
          type: integer
          minimum: 1
        repsPerSet:
          type: integer
          minimum: 1
        targetHoldSeconds:
          type: integer
          minimum: 0
        restBetweenSets:
          type: integer
          minimum: 0
          default: 60
        difficultyLevel:
          type: number
          format: float
          minimum: 0
          default: 1.0
        strictMode:
          type: boolean
          default: false
        allowSkip:
          type: boolean
          default: true

    CreateRoutineRequest:
      type: object
      required: [patientId, name, startDate, items]
      properties:
        patientId:
          type: string
          format: uuid
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        therapistNotes:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoutineItemRequest'

    UpdateRoutineRequest:
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        therapistNotes:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoutineItemRequest'

    RoutineItemResponse:
      type: object
      required: [id, routineId, exerciseId, orderIndex, sets, repsPerSet, targetHoldSeconds, difficultyLevel, restBetweenSets, strictMode, allowSkip]
      properties:
        id:
          type: string
          format: uuid
        routineId:
          type: string
          format: uuid
        exerciseId:
          type: string
          format: uuid
        orderIndex:
          type: integer
        sets:
          type: integer
        repsPerSet:
          type: integer
        targetHoldSeconds:
          type: integer
        difficultyLevel:
          type: number
          format: float
        restBetweenSets:
          type: integer
        strictMode:
          type: boolean
        allowSkip:
          type: boolean
        exercise:
          $ref: './exercises.yaml#/components/schemas/ExerciseResponse'

    RoutineResponse:
      type: object
      required: [id, patientId, name, startDate, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: './common.yaml#/components/schemas/RoutineStatus'
        therapistNotes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoutineItemResponse'
        patient:
          $ref: './patients.yaml#/components/schemas/PatientResponse'
        sessionsCount:
          type: integer
          description: Computed count of sessions (GET /routines/{id} only)
