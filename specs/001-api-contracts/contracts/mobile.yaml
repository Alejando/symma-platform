openapi: 3.0.3
info:
  title: Symma API — Mobile Contracts
  version: 1.1.0
  description: Every endpoint requires a patient JWT.

paths:
  /mobile/routine/active:
    get:
      tags: [Mobile]
      operationId: getActiveRoutine
      summary: Get the active routine for the logged-in patient
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >
            The patient's only ACTIVE routine with its exercises. The body is empty when the patient
            has no ACTIVE routine; DRAFT and ARCHIVED routines are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveRoutineResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /mobile/snapshots/upload-url:
    post:
      tags: [Mobile]
      operationId: createSnapshotUploadUrl
      summary: Presigned URL to upload the best-attempt snapshot of an exercise
      description: >
        PUT the JPEG to uploadUrl with header Content-Type image/jpeg, then send snapshotKey in the
        session item. A failed snapshot must never block session sync.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotUploadUrlRequest'
      responses:
        '201':
          description: Upload URL issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotUploadUrlResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          description: The session id belongs to another patient
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'
        '404':
          description: Unknown exercise
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'
        '503':
          $ref: './common.yaml#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ActiveRoutineExerciseResponse:
      type: object
      required: [id, name, keyName, type, category]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        keyName:
          type: string
        description:
          type: string
          nullable: true
        type:
          $ref: './common.yaml#/components/schemas/ExerciseType'
        category:
          $ref: './common.yaml#/components/schemas/ExerciseCategory'
        mobileModule:
          allOf:
            - $ref: './common.yaml#/components/schemas/MobileModule'
          nullable: true
        assetAnimationUrl:
          type: string
          nullable: true
        assetTutorialVideoUrl:
          type: string
          nullable: true

    ActiveRoutineItemResponse:
      type: object
      required: [id, orderIndex, sets, repsPerSet, targetHoldSeconds, restBetweenSets, difficultyLevel, strictMode, exercise]
      properties:
        id:
          type: string
          format: uuid
        orderIndex:
          type: integer
        sets:
          type: integer
          description: "Canonical name (replaces former 'targetSets')"
        repsPerSet:
          type: integer
          description: "Canonical name (replaces former 'targetRepetitions')"
        targetHoldSeconds:
          type: integer
          description: "Canonical name (replaces former 'holdTimeSeconds')"
        restBetweenSets:
          type: integer
          description: "Canonical name (replaces former 'restBetweenSetsSeconds')"
        difficultyLevel:
          type: number
          format: float
        strictMode:
          type: boolean
        exercise:
          $ref: '#/components/schemas/ActiveRoutineExerciseResponse'

    ActiveRoutineResponse:
      type: object
      required: [id, name, startDate, status, items]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: './common.yaml#/components/schemas/RoutineStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActiveRoutineItemResponse'

    SnapshotUploadUrlRequest:
      type: object
      required: [sessionId, exerciseId, contentType]
      properties:
        sessionId:
          type: string
          format: uuid
          description: Client-generated id of the session being recorded
        exerciseId:
          type: string
          format: uuid
        contentType:
          type: string
          enum: [image/jpeg]

    SnapshotUploadUrlResponse:
      type: object
      required: [uploadUrl, snapshotKey, expiresInSeconds]
      properties:
        uploadUrl:
          type: string
          format: uri
        snapshotKey:
          type: string
          description: snapshots/{patientId}/{sessionId}/{exerciseId}.jpg
        expiresInSeconds:
          type: integer
          example: 300
