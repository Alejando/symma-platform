openapi: 3.0.3
info:
  title: Symma API — Auth Contracts
  version: 1.1.0
  description: >
    Therapist tokens last JWT_THERAPIST_EXPIRES_IN (8h by default) and stop working when the
    therapist is deactivated. Patient tokens last JWT_PATIENT_EXPIRES_IN (7d by default) and stop
    working when the PIN is revoked or regenerated or the patient is archived.

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: therapistLogin
      summary: Therapist login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          description: Invalid credentials or inactive therapist
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'

  /auth/profile:
    get:
      tags: [Auth]
      operationId: getTherapistProfile
      summary: Get authenticated therapist profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile of the authenticated therapist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TherapistProfileResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /auth/patient/login:
    post:
      tags: [Mobile Auth]
      operationId: mobileLogin
      summary: Patient login with the 6-digit PIN only
      description: >
        After 5 failed attempts within 15 minutes from the same client IP the endpoint answers 429,
        even for a correct PIN, until the window expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginRequest'
      responses:
        '200':
          description: Patient token and identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileLoginResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          description: Unknown PIN or archived patient
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: JWT bearer token

    TherapistProfileResponse:
      type: object
      required: [id, email, firstName, lastName, role, clinicId]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: './common.yaml#/components/schemas/Role'
        clinicId:
          type: string
          format: uuid

    MobileLoginRequest:
      type: object
      required: [accessCode]
      properties:
        accessCode:
          type: string
          pattern: '^\d{6}$'
          description: 6-digit PIN generated by therapist

    MobileLoginResponse:
      type: object
      required: [accessToken, patient]
      properties:
        accessToken:
          type: string
        patient:
          type: object
          required: [id, firstName, lastName]
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            lastName:
              type: string
