openapi: 3.0.3
info:
  title: Symma API — Auth Contracts
  version: 1.0.0

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: therapistLogin
      summary: Therapist login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'

  /auth/profile:
    get:
      tags: [Auth]
      operationId: getTherapistProfile
      summary: Get authenticated therapist profile
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TherapistProfileResponse'
        '404':
          description: User not found

  /auth/patient/login:
    post:
      tags: [Mobile Auth]
      operationId: mobileLogin
      summary: Patient login with 6-digit access code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileLoginResponse'
        '401':
          description: Invalid access code

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: JWT bearer token

    TherapistProfileResponse:
      type: object
      required: [id, email, firstName, lastName, role, clinicId]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: './common.yaml#/components/schemas/Role'
        clinicId:
          type: string
          format: uuid

    MobileLoginRequest:
      type: object
      required: [accessCode]
      properties:
        accessCode:
          type: string
          description: 6-digit PIN generated by therapist

    MobileLoginResponse:
      type: object
      required: [accessToken, patient]
      properties:
        accessToken:
          type: string
        patient:
          type: object
          required: [id, firstName, lastName]
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            lastName:
              type: string
