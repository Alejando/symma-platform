services:
  # PostgreSQL Database
  postgres:
    container_name: symma_db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-symma_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-symma_password}
      POSTGRES_DB: ${POSTGRES_DB:-symma_db}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - symma_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-symma_admin}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API
  api:
    container_name: symma_api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-symma_admin}:${POSTGRES_PASSWORD:-symma_password}@postgres:5432/${POSTGRES_DB:-symma_db}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
    ports:
      - "4001:4001"
    networks:
      - symma_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Next.js Web App
  web:
    container_name: symma_web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001}
      AUTH_SECRET: ${AUTH_SECRET:-your-auth-secret-key}
    ports:
      - "4000:4000"
    networks:
      - symma_net
    depends_on:
      - api
    restart: unless-stopped

networks:
  symma_net:
    driver: bridge

volumes:
  postgres_data:
