services:
  postgres:
    container_name: ${POSTGRES_CONTAINER_NAME:-symma_db}
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-symma_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-symma_db}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - symma_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-symma_admin}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # The official minio/minio and minio/mc images are no longer published on Docker Hub or Quay.
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-symma_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required, see .env.example}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-symma-snapshots}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - symma_net
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://127.0.0.1:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-symma_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}@postgres:5432/${POSTGRES_DB:-symma_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, see .env.example}
      PIN_HMAC_SECRET: ${PIN_HMAC_SECRET:?PIN_HMAC_SECRET is required, see .env.example}
      JWT_THERAPIST_EXPIRES_IN: ${JWT_THERAPIST_EXPIRES_IN:-8h}
      JWT_PATIENT_EXPIRES_IN: ${JWT_PATIENT_EXPIRES_IN:-7d}
      ANALYTICS_TIME_ZONE: ${ANALYTICS_TIME_ZONE:-UTC}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-symma-snapshots}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-symma_minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required, see .env.example}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "${API_PORT:-4001}:4001"
    networks:
      - symma_net
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4001/api/v1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://api:4001
    environment:
      NEXT_PUBLIC_API_URL: http://api:4001
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required, see .env.example}
      AUTH_URL: ${AUTH_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-4000}:4000"
    networks:
      - symma_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  symma_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
